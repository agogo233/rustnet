name: Build AMD64 Musl Static

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  build-musl-amd64:
    name: build-x86_64-musl-static
    runs-on: ubuntu-24.04
    container:
      image: rust:alpine
    steps:
      - name: Checkout repository
        run: |
          apk add --no-cache git
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Install dependencies
        run: |
          apk add --no-cache \
            musl-dev libpcap-dev pkgconfig build-base perl \
            elfutils-dev zlib-dev zlib-static zstd-dev zstd-static \
            clang llvm linux-headers
          rustup component add rustfmt

      - name: Build static binary
        env:
          RUSTFLAGS: "-C strip=symbols -C link-arg=-l:libzstd.a"
        run: |
          cargo build --release
          file target/release/rustnet
          file target/release/rustnet | grep -q "static.* linked" || \
            (echo "ERROR: Binary is not statically linked" && exit 1)

      - name: Prepare artifact
        run: |
          VERSION="${{ inputs.version }}"
          staging="rustnet-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$staging/assets"
          cp target/release/rustnet "$staging/"
          cp crates/rustnet-core/assets/services "$staging/assets/" 2>/dev/null || true
          tar czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustnet-${{ inputs.version }}-x86_64-unknown-linux-musl
          path: rustnet-${{ inputs.version }}-x86_64-unknown-linux-musl.tar.gz
